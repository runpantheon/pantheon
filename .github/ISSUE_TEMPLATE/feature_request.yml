name: Feature request
description: Something Pantheon should do that it doesn't yet.
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is **public**: please leave out anything personal.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you're trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like it to work, if you have an idea.
  - type: dropdown
    id: where
    attributes:
      label: Where would you use it?
      multiple: true
      options:
        - Web app
        - Mac app
        - AI tools
        - Command line
        - Developer API
