name: Bug report
description: Something in Pantheon doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. This issue is **public**: please don't paste message content, phone numbers, email addresses or anything else personal. If the problem needs your account details, email support@pantheon.run instead.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Web app (app.pantheon.run)
        - Mac app
        - AI tool connection (Claude, ChatGPT, Cursor…)
        - Command line (pantheon CLI)
        - Developer API
        - Somewhere else
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Which channel, if any?
      options:
        - Not about a channel
        - Telegram
        - WhatsApp
        - iMessage
        - X
        - Email
        - Another channel
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: App version
      description: Mac app → About Pantheon, or `pantheon --version` for the command line. Leave blank for the web app.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots help (crop out anything personal).
